name: Mobile local vault checks
on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', 'src/lib/**', '.github/workflows/mobile-checks.yml']
  push:
    branches: ['feat/mobile-local-vault']
    paths: ['mobile/**', 'src/lib/**', '.github/workflows/mobile-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:connectors
      - run: npm run db:generate
      - run: git diff --exit-code -- drizzle src/storage/migrations.generated.ts
      - run: npm run export
